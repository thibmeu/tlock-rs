[package]
name = "tlock"
description = "Rust encryption library for practical time-lock encryption."
version = "0.0.9"
authors = ["Thibault Meunier <crates@thibault.uk>"]
edition = "2024"
readme = "./README.md"
homepage = "https://github.com/thibmeu/tlock-rs"
repository = "https://github.com/thibmeu/tlock-rs"
keywords = ["tlock", "cryptography", "encryption"]
categories = ["cryptography"]
license = "MIT"

[dependencies]
anyhow = { workspace = true }
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
itertools = "0.15"
rand = { workspace = true, default-features = false, features = ["std", "std_rng", "thread_rng"]}
serde = { version = "1.0", features = ["derive"] }
serde_with = "3"
sha2 = "0.10"
thiserror = { workspace = true }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
drand_core = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[features]
default = ["rfc9380"]
rfc9380 = []

[[bench]]
name = "encrypt_decrypt"
harness = false
